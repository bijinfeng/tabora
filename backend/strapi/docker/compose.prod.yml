services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  strapi:
    build:
      context: ../..
      dockerfile: backend/strapi/Dockerfile
    env_file:
      - ../.env
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/strapi.conf:/etc/nginx/conf.d/default.conf:ro
      # 如果需要 HTTPS，挂载证书
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - strapi
    restart: unless-stopped

volumes:
  postgres_data:
