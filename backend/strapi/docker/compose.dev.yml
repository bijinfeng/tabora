services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tabora
      POSTGRES_USER: tabora
      POSTGRES_PASSWORD: tabora
    ports:
      - "5433:5432"

  strapi:
    build:
      context: ../..
      dockerfile: backend/strapi/Dockerfile
    env_file:
      - ../.env.example
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: tabora
      DATABASE_USERNAME: tabora
      DATABASE_PASSWORD: tabora
    volumes:
      - ..:/workspace/backend/strapi:ro
    ports:
      - "1337:1337"
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/strapi.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - strapi
