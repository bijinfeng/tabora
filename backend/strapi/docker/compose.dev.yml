services:
  mailpit:
    image: axllent/mailpit:v1.28.2
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tabora
      POSTGRES_USER: tabora
      POSTGRES_PASSWORD: tabora
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  strapi:
    build:
      context: ..
      dockerfile: Dockerfile
      target: deps
    command: npm run develop
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: tabora
      DATABASE_USERNAME: tabora
      DATABASE_PASSWORD: tabora
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: "dev1,dev2,dev3,dev4"
      API_TOKEN_SALT: devsalt
      ADMIN_JWT_SECRET: devadminjwt
      TRANSFER_TOKEN_SALT: devtransfer
      JWT_SECRET: devjwt
      ENCRYPTION_KEY: devencryption
      EMAIL_PROVIDER: sendmail
      EMAIL_DEV_HOST: mailpit
      EMAIL_DEV_PORT: 1025
      EMAIL_DEFAULT_FROM: no-reply@tabora.local
      EMAIL_DEFAULT_REPLY_TO: support@tabora.local
    volumes:
      - ..:/app
      - /app/node_modules
    ports:
      - "1337:1337"
    depends_on:
      - mailpit
      - postgres

volumes:
  postgres_dev_data:
