packages:
  - apps/*
  - packages/*
  - plugins/*
  - plugins/*/*
  - tooling/*
  - backend/app

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vitest: 4.1.10

allowBuilds:
  "@prisma/client": false
  "@swc/core": false
  argon2: true
  better-sqlite3: true
  braintrust: true
  core-js-pure: false
  esbuild: true
  isolated-vm: true
  oracledb: true
  protobufjs: true
  sharp: true
  spawn-sync: true
  sqlite3: true
  vue-demi: true

catalogs:
  node:
    "@types/node": ^25.9.1
  build:
    "@stylexjs/unplugin": ^0.19.0
    tsdown: ^0.22.14
    typescript: ^6.0.3
    vite: ^8.1.5
    vite-plugin-solid: ^2.11.14
    vite-plus: ^0.2.6
  style:
    "@stylexjs/stylex": ^0.19.0
  data:
    dexie: ^4.4.2
    zod: ^4.4.3
  ai:
    ai: ^7.0.22
  test:
    "@vitest/browser-playwright": ^4.1.10
    fake-indexeddb: ^6.2.5
    happy-dom: ^20.9.0
    playwright: ^1.62.0
    vitest: ^4.1.10
  ui:
    "@kobalte/core": ^0.13.11
    "@solid-primitives/event-bus": ^1.1.3
    "@solid-primitives/media": ^2.3.5
    "@solid-primitives/timer": ^1.4.4
    "@solidjs/router": ^0.16.1
    "@tanstack/charts": ^0.6.5
    "@tanstack/charts-scales": ^0.6.5
    "@tanstack/solid-charts": ^0.6.5
    "@tanstack/solid-query": ^5.101.4
    lucide-solid: ^1.16.0
    solid-js: ^1.9.13
  toolkit:
    es-toolkit: ^1.47.0

minimumReleaseAgeExclude:
  - vite-plugin-solid@2.11.14
  - fastify@5.11.2
